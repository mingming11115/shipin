<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500" role="img" aria-label="两层递归：任务层与 harnessing 层">
  <defs>
    <marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9a9284"/>
    </marker>
    <marker id="a-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/>
    </marker>
    <marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/>
    </marker>
  </defs>

  <rect width="1000" height="500" fill="none"/>
  <text x="20" y="24" font-family="-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="13" fill="#9a9284">Harness² · 两层递归</text>

  <!-- ========== Lane 1 ========== -->
  <rect x="20" y="36" width="960" height="196" rx="14" fill="#fdf4ec" stroke="#f0d3bf"/>
  <text x="42" y="62" font-family="-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="16" font-weight="700" fill="#c2410c">① 任务层递归</text>
  <text x="196" y="62" font-family="-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="13" fill="#a8683f">每个任务从干净的 H0 重开，只改当前这份 harness</text>

  <g font-family="-apple-system,'Segoe UI','Microsoft YaHei',sans-serif">
    <!-- node 1 -->
    <rect x="40" y="86" width="132" height="64" rx="10" fill="#ffffff" stroke="#e2d6c6"/>
    <text x="106" y="112" font-size="15" font-weight="600" text-anchor="middle" fill="#1c1a17">任务 q_t</text>
    <text x="106" y="132" font-size="12" text-anchor="middle" fill="#6b655c">无标签 · 无验证器</text>

    <!-- node 2 -->
    <rect x="192" y="86" width="132" height="64" rx="10" fill="#ffffff" stroke="#e2d6c6"/>
    <text x="258" y="112" font-size="15" font-weight="600" text-anchor="middle" fill="#1c1a17">参考执行</text>
    <text x="258" y="132" font-size="12" text-anchor="middle" fill="#6b655c">产出 e₀，不判对错</text>

    <!-- node 3 -->
    <rect x="344" y="86" width="132" height="64" rx="10" fill="#fff9f4" stroke="#e8b58e" stroke-width="1.5"/>
    <text x="410" y="112" font-size="15" font-weight="600" text-anchor="middle" fill="#1c1a17">Propose ×2</text>
    <text x="410" y="132" font-size="12" text-anchor="middle" fill="#8a5a3a">INV 通病 / DOM 领域</text>

    <!-- node 4 -->
    <rect x="496" y="86" width="132" height="64" rx="10" fill="#ffffff" stroke="#e2d6c6"/>
    <text x="562" y="112" font-size="15" font-weight="600" text-anchor="middle" fill="#1c1a17">Probe</text>
    <text x="562" y="132" font-size="12" text-anchor="middle" fill="#6b655c">同模型同环境重跑</text>

    <!-- node 5 -->
    <rect x="648" y="86" width="132" height="64" rx="10" fill="#ffffff" stroke="#e2d6c6"/>
    <text x="714" y="112" font-size="15" font-weight="600" text-anchor="middle" fill="#1c1a17">Compose</text>
    <text x="714" y="132" font-size="12" text-anchor="middle" fill="#6b655c">按证据合成 H′</text>

    <!-- node 6 -->
    <rect x="800" y="86" width="132" height="64" rx="10" fill="#f6f2e9" stroke="#e2d6c6"/>
    <text x="866" y="112" font-size="15" font-weight="600" text-anchor="middle" fill="#1c1a17">交付</text>
    <text x="866" y="132" font-size="12" text-anchor="middle" fill="#6b655c">产出 e′</text>

    <!-- arrows lane1 -->
    <line x1="174" y1="118" x2="188" y2="118" stroke="#9a9284" stroke-width="1.6" marker-end="url(#a-gray)"/>
    <line x1="326" y1="118" x2="340" y2="118" stroke="#9a9284" stroke-width="1.6" marker-end="url(#a-gray)"/>
    <line x1="478" y1="118" x2="492" y2="118" stroke="#9a9284" stroke-width="1.6" marker-end="url(#a-gray)"/>
    <line x1="630" y1="118" x2="644" y2="118" stroke="#9a9284" stroke-width="1.6" marker-end="url(#a-gray)"/>
    <line x1="782" y1="118" x2="796" y2="118" stroke="#9a9284" stroke-width="1.6" marker-end="url(#a-gray)"/>

    <!-- budget loop -->
    <path d="M714,150 L714,178 L410,178 L410,154" fill="none" stroke="#c2410c" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a-orange)"/>
    <text x="562" y="196" font-size="12.5" text-anchor="middle" fill="#c2410c">预算 k：并行 k 路（宽度） / 串行 k 步（深度）</text>
  </g>

  <!-- ========== Lane 2 ========== -->
  <rect x="20" y="286" width="960" height="150" rx="14" fill="#eef6f4" stroke="#cfe6e1"/>
  <text x="42" y="312" font-family="-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="16" font-weight="700" fill="#0f766e">② Harnessing 层递归</text>
  <text x="212" y="312" font-family="-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="13" fill="#3f7d75">不重开，跨任务持续累积：换个任务，改法更聪明</text>

  <g font-family="-apple-system,'Segoe UI','Microsoft YaHei',sans-serif">
    <rect x="40" y="334" width="180" height="64" rx="10" fill="#ffffff" stroke="#cfe6e1"/>
    <text x="130" y="360" font-size="15" font-weight="600" text-anchor="middle" fill="#1c1a17">交付完成</text>
    <text x="130" y="380" font-size="12" text-anchor="middle" fill="#6b655c">完整改进记录留在手里</text>

    <rect x="250" y="334" width="180" height="64" rx="10" fill="#ffffff" stroke="#cfe6e1"/>
    <text x="340" y="360" font-size="15" font-weight="600" text-anchor="middle" fill="#1c1a17">Reflect 复盘</text>
    <text x="340" y="380" font-size="12" text-anchor="middle" fill="#6b655c">怎么诊断 · 改了什么 · 结果如何</text>

    <rect x="460" y="334" width="180" height="64" rx="10" fill="#f3faf8" stroke="#9ccdc5" stroke-width="1.5"/>
    <text x="550" y="360" font-size="15" font-weight="600" text-anchor="middle" fill="#1c1a17">改进库</text>
    <text x="550" y="380" font-size="12" text-anchor="middle" fill="#3f7d75">采纳的 H* + EXPERIENCE.md</text>

    <rect x="670" y="334" width="180" height="64" rx="10" fill="#ffffff" stroke="#cfe6e1"/>
    <text x="760" y="360" font-size="15" font-weight="600" text-anchor="middle" fill="#1c1a17">改进 harness R</text>
    <text x="760" y="380" font-size="12" text-anchor="middle" fill="#6b655c">指导下一个任务怎么改</text>

    <line x1="224" y1="366" x2="246" y2="366" stroke="#9a9284" stroke-width="1.6" marker-end="url(#a-gray)"/>
    <line x1="434" y1="366" x2="456" y2="366" stroke="#9a9284" stroke-width="1.6" marker-end="url(#a-gray)"/>
    <line x1="644" y1="366" x2="666" y2="366" stroke="#9a9284" stroke-width="1.6" marker-end="url(#a-gray)"/>
  </g>

  <!-- connectors -->
  <path d="M866,150 L866,238 L130,238 L130,330" fill="none" stroke="#9a9284" stroke-width="1.6" marker-end="url(#a-gray)"/>
  <path d="M760,330 L760,262 L410,262 L410,154" fill="none" stroke="#c2410c" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#a-orange)"/>
  <rect x="470" y="251" width="236" height="22" rx="5" fill="#fdf4ec" opacity="0.95"/>
  <text x="588" y="267" font-family="-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="12.5" text-anchor="middle" fill="#c2410c">下一任务：读库，指导 Propose 与 Compose</text>

  <text x="20" y="472" font-family="-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="13" fill="#6b655c">全程冻结：模型权重 · 阶段提示词 · 决策规则 —— 真正在进化的只有那个改进库</text>
</svg>
