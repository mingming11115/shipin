<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420" role="img" aria-label="弱模型加好脚手架反超强模型">
  <defs>
    <marker id="b-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9a9284"/>
    </marker>
  </defs>
  <rect width="1000" height="420" fill="none"/>
  <text x="24" y="34" font-family="-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="19" font-weight="700" fill="#1c1a17">弱模型 + 进化的脚手架，反超强模型裸跑</text>
  <text x="24" y="58" font-family="-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="13" fill="#6b655c">WorkBuddy-Bench 平均分 · 单步改进（k=1） · 数据：论文 Table 1</text>

  <!-- 坐标轴 -->
  <line x1="120" y1="70" x2="120" y2="330" stroke="#c9c1b2" stroke-width="1.5"/>
  <line x1="120" y1="330" x2="880" y2="330" stroke="#c9c1b2" stroke-width="1.5"/>
  <g font-family="-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="12" fill="#9a9284" text-anchor="end">
    <text x="112" y="334">60</text>
    <text x="112" y="266.5">65</text>
    <text x="112" y="199">70</text>
    <text x="112" y="131.5">75</text>
  </g>
  <g stroke="#eee9df" stroke-width="1">
    <line x1="120" y1="262.5" x2="880" y2="262.5"/>
    <line x1="120" y1="195" x2="880" y2="195"/>
    <line x1="120" y1="127.5" x2="880" y2="127.5"/>
  </g>

  <!-- Gemini 基准虚线 -->
  <line x1="120" y1="162.6" x2="880" y2="162.6" stroke="#5a7d8c" stroke-width="1.4" stroke-dasharray="6 5"/>
  <text x="128" y="150" font-family="-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="12.5" fill="#5a7d8c">Gemini 3.5 Flash 裸 OpenCode = 72.4</text>

  <!-- 柱 1：GLM-5 裸 -->
  <rect x="220" y="273.3" width="120" height="56.7" rx="6" fill="#e7e2d8" stroke="#c9c1b2"/>
  <text x="280" y="262" font-family="-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="20" font-weight="700" fill="#6b655c" text-anchor="middle">64.2</text>
  <text x="280" y="356" font-family="-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="14" font-weight="600" fill="#1c1a17" text-anchor="middle">GLM-5 · 裸 OpenCode</text>
  <text x="280" y="376" font-family="-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="12" fill="#9a9284" text-anchor="middle">起点</text>

  <!-- 柱 2：Gemini 裸 -->
  <rect x="440" y="162.6" width="120" height="167.4" rx="6" fill="#dfe9ee" stroke="#a9c1cd"/>
  <text x="500" y="152" font-family="-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="20" font-weight="700" fill="#5a7d8c" text-anchor="middle">72.4</text>
  <text x="500" y="356" font-family="-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="14" font-weight="600" fill="#1c1a17" text-anchor="middle">Gemini 3.5 Flash · 裸 OpenCode</text>
  <text x="500" y="376" font-family="-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="12" fill="#9a9284" text-anchor="middle">更强的模型，同样的脚手架</text>

  <!-- 柱 3：GLM-5 + Harness2 -->
  <rect x="660" y="118" width="120" height="212" rx="6" fill="#f6c9ad" stroke="#c2410c" stroke-width="2"/>
  <text x="720" y="107" font-family="-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="22" font-weight="700" fill="#c2410c" text-anchor="middle">75.7</text>
  <text x="720" y="356" font-family="-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="14" font-weight="700" fill="#c2410c" text-anchor="middle">GLM-5 · Harness²</text>
  <text x="720" y="376" font-family="-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="12" fill="#a8683f" text-anchor="middle">同一个弱模型，脚手架进化一次</text>

  <!-- 涨幅标注 -->
  <path d="M348,273 L652,130" fill="none" stroke="#c2410c" stroke-width="1.6" marker-end="url(#b-gray)"/>
  <rect x="404" y="184" width="150" height="24" rx="6" fill="#fdf4ec"/>
  <text x="479" y="201" font-family="-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="13.5" font-weight="700" fill="#c2410c" text-anchor="middle">+11.5 分（一步）</text>

  <text x="500" y="404" font-family="-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="13" fill="#6b655c" text-anchor="middle">模型一个参数都没动 —— 变的只是 8 个 harness 文件</text>
</svg>
